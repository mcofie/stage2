<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 2 Labs</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇬🇭</text></svg>">
    <!-- Google Fonts: Geist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text-primary: #111111;
            --text-secondary: #737373;
            --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f0f;
                --text-primary: #f2f2f2;
                --text-secondary: #8a8a8a;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        .inscription {
            position: fixed;
            top: 0;
            left: 0;
            padding: clamp(1.25rem, 4vw, 2.5rem);
            padding-top: calc(clamp(1.25rem, 4vw, 2.5rem) + env(safe-area-inset-top, 0px));
            padding-left: calc(clamp(1.25rem, 4vw, 2.5rem) + env(safe-area-inset-left, 0px));
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            user-select: none;
        }

        .inscription-title {
            font-size: clamp(0.95rem, 1.8vw, 1.05rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.35;
            color: var(--text-primary);
        }

        .inscription-location {
            font-size: clamp(0.85rem, 1.5vw, 0.925rem);
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.35;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="inscription">
        <span class="inscription-title">Stage 2 Labs</span>
        <span class="inscription-location">Accra, Ghana</span>
    </div>
</body>
</html>
